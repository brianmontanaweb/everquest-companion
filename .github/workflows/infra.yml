# Terraform + Lambda-bundle verification for infra/.
#
# THIS WORKFLOW NEVER PLANS AND NEVER APPLIES. It holds no cloud credentials, no
# OIDC deploy role and no secrets of any kind, because this repository is PUBLIC
# and a deploy identity reachable from a public workflow is a deploy identity
# reachable from a pull request. Deployment is a MANUAL act from the dev machine
# against the sub-account profile (see infra/README.md); `terraform plan` is the
# review artifact and a human reads it.
#
# What it does prove, on every change to infra/ or to the shared contract:
#
#   fmt -check          the HCL is canonically formatted
#   init -backend=false provider requirements resolve WITHOUT touching the S3
#                       backend (no credentials, no state, no lock)
#   validate            every resource/reference/type actually checks out
#   node infra/build.mjs  the handler still BUNDLES — i.e. the Lambda's import of
#                       validateSubmit from src/shared/feedback.ts is intact.
#                       That last one is the point: it is what stops the client
#                       and the server from drifting apart silently.
#
# The bundle step is why `src/shared/feedback.ts` is in the path filter: a change
# to the contract can break the server bundle without touching a single .tf file.
#
# ACTION PINNING follows build.yml — full 40-char commit SHAs with the floating
# tag in a trailing comment, because a `@v4` tag is a MUTABLE pointer. Re-resolve
# with: gh api repos/<owner>/<action>/git/ref/tags/<tag> --jq .object.sha
#
# WHY THE PATH FILTER IS ON THE JOB, NOT ON THE TRIGGER (JOS report, 2026-09).
# `verify` is a REQUIRED status check on `main` (branch protection names it
# unconditionally, the same as `build`/`engine`/`release`). A `paths:` filter on
# `on:` controls whether the WORKFLOW RUN EXISTS at all — for a PR that touches
# none of the paths below, no run is ever created, so no check is ever posted for
# that context, and GitHub has nothing to reconcile against the required-checks
# list. The PR sits "Expected — waiting for status to be reported" forever: not
# pending in the sense of running, structurally unable to ever resolve. (PR #6
# is the case that surfaced this — an app-only change, zero infra/feedback files
# touched, blocked on a check that was never going to run.)
#
# The fix is the inverse: the workflow ALWAYS triggers, so the required context
# always gets a check run. `changes` (below) is the only job that always executes
# real steps — a `git diff` against the base ref, cheap and dependency-free — and
# `verify` is gated on ITS OWN `if:`, computed from that diff. A job skipped by
# `if:` reports conclusion SKIPPED, and GitHub treats a skipped required check as
# PASSING for merge purposes (unlike case one above, the check run exists — it
# just had nothing to do). An unresolvable base ref (a brand-new branch's first
# push, `event.before` all-zero) is treated as RELEVANT rather than skipped: the failure
# mode of guessing wrong here is a Terraform break sneaking through unverified,
# which is worse than an occasional needless real run.

name: infra

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  # Always runs (see the header above for why the path filter lives here and not
  # on `on:`). Answers one question — did this push/PR touch infra's inputs —
  # and exposes it as `changes.outputs.relevant` for `verify` to gate on.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false
          # The base commit has to be reachable to diff against — the default
          # depth-1 clone only has HEAD. Same reasoning as build.yml's ratchet
          # checkout.
          fetch-depth: 0

      - name: Did infra's inputs change
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no comparable base (new branch, or the first push) -- assuming relevant"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE_SHA" HEAD -- infra/ src/shared/feedback.ts .github/workflows/infra.yml | grep -q .; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (v4.4.0)
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4 (v4.0.1)
        with:
          terraform_version: 1.9.8
          # The wrapper rewrites stdout to feed step outputs we do not use, and it
          # swallows exit codes in ways that make a failing check read as a pass.
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # -backend=false is load-bearing: it resolves providers without reading the
      # S3 backend, so this job needs no AWS credentials and cannot touch state.
      - name: Terraform init (no backend)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (v4.4.0)
        with:
          # .nvmrc is the one source for this, same as build.yml.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # `.npmrc` sets ignore-scripts=true. Unlike build.yml this job does NOT run
      # `npm run deps:electron`: nothing here launches Electron, and skipping the
      # ~190 MB binary download keeps the check fast.
      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Bundle the Lambda handler
        run: node infra/build.mjs
        working-directory: .
